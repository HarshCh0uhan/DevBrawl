# ──────────────────────────────────────────────────────────────────────────────
# DevBrawl - GitHub Actions CI/CD to Oracle Cloud Always Free
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
  ORACLE_USER: ubuntu
  DEPLOY_PATH: /var/www/devbrawl

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: cd Backend && npm ci

      - name: Install Frontend Dependencies
        run: cd Frontend && npm ci

      - name: Run Backend Lint
        run: cd Backend && npm run lint

      - name: Run Frontend Lint
        run: cd Frontend && npm run lint

      - name: Run Backend Tests
        run: cd Backend && npm test

      - name: Run Frontend Tests
        run: cd Frontend && npm test

  build-and-deploy:
    name: Build & Deploy to Oracle Cloud
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (optional - for caching)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          load: true
          tags: devbrawl-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          load: true
          tags: devbrawl-frontend:latest
          build-args: |
            VITE_API_URL=https://${{ secrets.DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Images
        run: |
          docker save devbrawl-backend:latest | gzip > backend.tar.gz
          docker save devbrawl-frontend:latest | gzip > frontend.tar.gz

      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            
            # Load images
            docker load < backend.tar.gz
            docker load < frontend.tar.gz
            
            # Deploy with docker-compose
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend
            
            # Cleanup
            rm backend.tar.gz frontend.tar.gz
            
            # Health check
            sleep 10
            curl -f https://${{ secrets.DOMAIN }}/health || exit 1

      - name: Notify Success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ DevBrawl deployment failed!",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deployment Failed*\nRepository: ${{ github.repository }}\nCommit: ${{ github.sha }}"}}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}