# ──────────────────────────────────────────────────────────────────────────────
# DevBrawl - Production Deployment (Oracle Cloud Always Free)
# ──────────────────────────────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

version: "3.8"

services:
  # ─── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: devbrawl-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=devbrawl
    networks:
      - devbrawl-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  # ─── Piston Code Execution Engine ───────────────────────────────────────────
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: devbrawl-piston
    restart: unless-stopped
    volumes:
      - piston_data:/piston
    environment:
      - PISTON_COMPILE_TIMEOUT=10000
      - PISTON_RUN_TIMEOUT=10000
      - PISTON_MAX_FILE_SIZE=100000
      - PISTON_MAX_OUTPUT_SIZE=1000000
    networks:
      - devbrawl-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: devbrawl-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=devbrawl
      - PISTON_API_URL=http://piston:2000
    env_file:
      - ./Backend/.env
    depends_on:
      mongodb:
        condition: service_started
      piston:
        condition: service_started
    networks:
      - devbrawl-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ─── Frontend (Nginx) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://${DOMAIN:-localhost}
    container_name: devbrawl-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - devbrawl-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ─── Certbot for SSL ────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: devbrawl-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - devbrawl-network

volumes:
  mongodb_data:
  piston_data:

networks:
  devbrawl-network:
    driver: bridge